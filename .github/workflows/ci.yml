name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      # Postgres with pgvector for integration tests. Throwaway credentials,
      # only reachable from this job.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fund_docs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/fund_docs_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Headless Chromium for the EDGAR render test (decision 0002).
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint and format
        run: npx biome ci .

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Fails when src/db/schema.ts changed without a committed migration.
      - name: Check migrations match the schema
        run: |
          npx drizzle-kit generate --name schema_drift_check
          if [ -n "$(git status --porcelain drizzle)" ]; then
            git status --porcelain drizzle
            echo "::error::schema.ts differs from the migrations; run npm run db:generate and commit"
            exit 1
          fi

      # Fails here, with a clear message, if the service container is broken,
      # instead of later as a confusing test error.
      - name: Check pgvector
        run: psql "$DATABASE_URL_TEST" -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS vector; SELECT extversion FROM pg_extension WHERE extname = 'vector';"

      # Fails if any test is skipped or todo, so a broken service container or a
      # stray it.skip cannot pass silently (same rule as the Python repo's CI).
      - name: Test
        run: npm run test:ci
